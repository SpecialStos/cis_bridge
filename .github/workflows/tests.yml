name: tests

# Pure-Lua suites only. They run under fengari with no FiveM server and no
# game assets, so this is safe to run on every push.
#
# The integration harness needs a running fxserver and is NOT run here. It is
# gated separately, by hand, on a test instance.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: unit + api contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: The workflow's own shell blocks parse
        # A `run:` block that is valid YAML and invalid bash fails on the
        # runner, not here. This repository has one that was a parse error for
        # its entire history -- a `case` glob containing a backtick, which bash
        # read as command substitution and died on before looking at a single
        # file -- and every run died on that step while looking exactly like a
        # broken codebase.
        run: npm run check:workflow

      - name: Install Lua 5.4 and luacheck
        # Both are luarock/apt packages rather than npm ones, so `npm ci` cannot
        # bring them. luacheck is pinned, because a linter that drifts under the
        # tests makes a red build ambiguous: was the code wrong, or was the
        # tool?
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4 luarocks
          sudo luarocks install luacheck 1.2.0
          luac5.4 -v
          luacheck --version

      - name: A MISSING TOOL MUST NOT LOOK LIKE A CLEAN BUILD
        # Every step below depends on a command being present. If the install
        # above silently did nothing -- a renamed package, a runner image
        # change, a permissions problem on the sudo -- the checks that follow
        # either fail on every file at once, which reads as "the code is
        # broken", or pass without having looked at anything.
        #
        # This repository has already paid for that failure twice: a workflow
        # that assumed `luac5.4` was on PATH reported EVERY file as a syntax
        # error for its entire history, and a syntax check written as a bash
        # `case` glob containing a backtick died before it parsed a single file.
        # Both looked exactly like a broken codebase.
        run: |
          for tool in luacheck luac5.4 node; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::error::$tool is not on PATH -- the checks below DID NOT RUN"
              exit 1
            fi
          done
          echo "All tools present."

      - name: Lint
        run: npm run lint

      - name: The luacheck config itself must parse
        # A `.luacheckrc` that fails to load is not an error in most lint
        # setups -- luacheck falls back to its defaults, which means every
        # global this resource defines is reported as undefined and every
        # FiveM native it calls is reported as an undefined global. That is
        # hundreds of findings against code that is fine, and the instinct is
        # to delete the config rather than read the error.
        #
        # So it is parsed explicitly here, before the lint that depends on it.
        # Parsed with `load`, not executed: the config assigns globals and
        # indexes a `files` table that only luacheck provides, so running it
        # under a stock Lua would fail on a line that is correct.
        run: |
          lua5.4 -e 'assert(loadfile(".luacheckrc"))' \
            && echo ".luacheckrc parses" \
            || { echo "::error::.luacheckrc does not parse -- lint would silently fall back to defaults"; exit 1; }

      - name: Syntax check
        run: npm run test:syntax

      - name: Run the test suites
        # Three suites, each in a fresh Lua state. 128 assertions.
        run: npm test

      - name: Validate api.lua against the registered surface
        # api.lua is a contract, not a comment. The validator reads what the
        # resource actually registers -- names and parameter lists, out of the
        # source -- and fails on the difference.
        run: npm run test:api

      - name: Prove the api.lua validator still rejects drift
        # A validator that has only ever been seen to pass has not been tested.
        # This asserts the real manifest is clean AND that each deliberately
        # broken fixture in test/api/broken/ still fails with the diagnostic it
        # was built to trigger. Delete a fixture and this step fails.
        run: npm run test:api-selftest

      - name: Fail if the exports binding regresses
        # Guards the `self` trap documented at the top of init.lua.
        # A bracket-form export call shifts every argument one slot left and
        # silently corrupts the whole API. The pattern matches the CALL shape
        # (exports[..][..]( ) rather than a specific quote style, so a
        # regression written with double quotes is caught too. Comment lines are
        # excluded so the documentation of the trap does not trip its own
        # tripwire; the suites are the real checks.
        run: |
          hits=$(grep -rnE 'exports\[[^]]+\]\[[^]]*\]\(' --include=*.lua . \
                 | grep -vE ':[[:space:]]*--' || true)
          if [ -n "$hits" ]; then
            echo "::error::Unbound exports call found. Pass the exports table as the first argument (see the header of the file that tripped it)."
            echo "$hits"
            exit 1
          fi
          echo "No unbound exports calls found."

      - name: No third-party host in the shipped source
        # A hardcoded host in the source is a supply-chain risk, not a feature.
        run: |
          hits=$(grep -rnE 'https?://[A-Za-z0-9.-]+\.(github\.io|githubusercontent\.com)' \
                 --include=*.lua . | grep -vE ':[[:space:]]*--' || true)
          if [ -n "$hits" ]; then
            echo "::error::Hardcoded third-party version host found in a Lua source file."
            echo "$hits"
            exit 1
          fi
          echo "No hardcoded third-party version hosts found."

      - name: The isolation invariant still holds
        # The entire licence argument for this resource is one file per
        # third-party target, and it is only real if nothing outside that file
        # REACHES ox_inventory. That is GPL-3.0 on roughly half of all servers
        # and a hard dependency of Qbox.
        #
        # This asserts the CALL, not the NAME. The first version of this check
        # grepped for the bare name and failed on this repository's own
        # fxmanifest.lua, api.lua and test files -- all of which mention
        # ox_inventory in prose, in a string, or in a comment, and none of which
        # depend on it in any way a licence cares about. A check that fires on
        # documentation is a check somebody deletes on its first run, and
        # deleting this one removes the only thing holding the mitigation in
        # place.
        #
# `exports.ox_inventory` and `exports['ox_inventory']` are the two forms
        # a call takes. Everything else is a comment, a test name, or the one
        # adapter file this is about.
        #
        # The exclusion matches on the file's BASE NAME rather than its path,
        # because `grep -rn PATTERN .` writes `./adapters/inventory/...` on the
        # runner and `.\adapters\inventory\...` under Git Bash. An exclusion
        # anchored on `/` silently stops matching on a developer machine -- which
        # is where a check like this gets debugged, and where a red run teaches
        # somebody the check is broken rather than that the boundary moved.
        run: |
          hits=$(grep -rnE "exports\.ox_inventory|exports\[['\"]ox_inventory['\"]\]" --include=*.lua . | grep -vE ':[[:space:]]*--' | grep -v 'ox_inventory\.lua' || true)
          if [ -n "$hits" ]; then
            echo "::error::ox_inventory is called outside its one adapter file."
            echo "That breaks the GPL isolation the whole resource exists to provide."
            echo "$hits"
            exit 1
          fi
          echo "ox_inventory is called in exactly one adapter file."

      - name: Lua syntax check against the real 5.4 parser
        # fengari is a Lua 5.3 VM, so it cannot catch a 5.4-only construct. That
        # gap is the reason this step exists, and it is worth keeping even
        # though the codebase uses nothing 5.4-specific -- `lua54 'yes'` in
        # fxmanifest.lua is an opt-in, and this is what keeps the opt-in honest.
        #
        # WHY THIS STEP IS NOT A ONE-LINER
        #
        # FiveM's backtick hash literals (`` `WEAPON_UNARMED` ``) are valid in
        # the Cfx Lua runtime and a syntax error to stock luac, so those files
        # have to be recognised and skipped rather than failed.
        #
        # A previous version of this step wrote that recognition as a bash glob:
        #
        #     *"unexpected symbol near `'"*) echo "skip";;
        #
        # which is a BASH PARSE ERROR. The glob opens a double quote, and a
        # backtick inside double quotes is command substitution -- so bash starts
        # looking for a closing backtick, never finds one, and dies with
        # "unexpected EOF" BEFORE IT PARSES A SINGLE FILE. Every run in this
        # repository's history was red and every run died on this step, with no
        # output to explain it. Nothing was ever checked.
        #
        # The identification below uses grep with SINGLE-quoted patterns, where a
        # backtick is literal, and it requires BOTH that luac complained about an
        # unexpected symbol AND that the file actually contains a backtick
        # literal. A file with a genuine syntax error does not have one, so it is
        # still reported -- the skip is narrow on purpose.
        run: |
          status=0
          while IFS= read -r f; do
            if err=$(luac5.4 -p "$f" 2>&1); then
              :
            elif printf '%s' "$err" | grep -qF 'unexpected symbol near'                  && grep -qE '`[^`]+`' "$f"; then
              echo "skip (FiveM hash literal): $f"
            else
              echo "SYNTAX ERROR: $f"
              echo "$err"
              status=1
            fi
          done < <(find . -name '*.lua' -not -path './node_modules/*')
          exit $status